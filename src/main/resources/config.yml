# ============================================================
#  ZHMguild - 玩家公会插件
#  适用核心: Paper 26.2   (Spigot / Paper 系)
#  文本格式: MiniMessage  https://docs.advntr.dev/minimessage/format.html
#           支持 <red> <#ff0000> <gradient:#00d2ff:#3a7bd5> <bold> 等标签
#  占位符  : 使用 {xxx} 形式, 例如 {player} {guild} {amount}
# ============================================================

# ---------------- 存储 ----------------
storage:
  # 可选: SQLITE / MYSQL
  type: SQLITE
  # 数据表前缀
  table-prefix: zhm_
  # 自动保存间隔(分钟), 0 表示关闭
  auto-save-minutes: 10
  mysql:
    host: 127.0.0.1
    port: 3306
    database: zhmguild
    username: root
    password: ''
    # 连接池大小
    pool-size: 6
    use-ssl: false
    # 附加连接参数
    parameters: 'useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
  sqlite:
    # 数据库文件, 位于插件数据目录
    file: zhmguild.db

# ---------------- 公会基础 ----------------
guild:
  # 公会名长度限制
  name-min-length: 2
  name-max-length: 12
  # 是否允许公会名使用颜色代码(需要权限 zhmguild.create.color)
  allow-color-name: false
  # 公会名是否区分大小写(是否允许同名不同大小写)
  name-case-sensitive: false
  # 玩家同时最多可申请的工会数量
  max-applications: 5
  # 申请 / 邀请有效期(小时), 0 = 永不过期
  application-expire-hours: 168
  # 默认最大成员数(未在 levels 中命中时使用)
  default-max-members: 10

  # 创建公会消耗
  create:
    money: 1000.0
    # 需要 PlayerPoints 点券
    points: 0
    # 需要的物品, 格式: 材质:数量
    items: []
    # 创建冷却(秒)
    cooldown: 60

  # 解散公会是否返还资金
  dissolve-refund: false

  # 修改公会名称花费
  rename-cost: 5000.0

  # 贡献设置(界面中: 左键使用第一个数值, 右键使用第二个数值)
  contribute:
    # 单次最少贡献
    min: 100.0
    presets:
      - 1000.0
      - 10000.0

# ---------------- 职位显示名 ----------------
roles:
  LEADER: '<red><bold>会长</bold></red>'
  VICE: '<gold>副会长</gold>'
  ELDER: '<yellow>长老</yellow>'
  MEMBER: '<gray>成员</gray>'

# ---------------- 公会等级 ----------------
# 等级影响最大成员数以及升级所需的资金与活跃
levels:
  1:
    max-members: 10
    up-money: 5000.0
    up-active: 200
  2:
    max-members: 15
    up-money: 12000.0
    up-active: 500
  3:
    max-members: 20
    up-money: 25000.0
    up-active: 1200
  4:
    max-members: 30
    up-money: 50000.0
    up-active: 2500
  5:
    max-members: 40
    up-money: 100000.0
    up-active: 5000
  6:
    max-members: 50
    up-money: 200000.0
    up-active: 10000
  # 最高等级, 到达后无法继续升级
  max-level: 6

# ---------------- 公会主城 ----------------
home:
  # 传送冷却(秒)
  teleport-cooldown: 30
  # 传送读条(秒), 0 = 立即传送
  teleport-delay: 3
  # 读条期间移动是否取消
  cancel-on-move: true
  # 设置主城需要的权限等级(LEADER / VICE / ELDER)
  set-permission: 'VICE'

# ---------------- 每日签到 ----------------
sign-in:
  # 基础奖励
  money: 200.0
  # 点券(需要 PlayerPoints)
  points: 0
  # 个人贡献
  contribution: 10.0
  # 公会活跃
  guild-active: 20
  # 连续签到额外加成: 连续天数 -> 倍率
  streak-bonus:
    3: 1.5
    7: 2.0
    15: 3.0
    30: 5.0
  # 断签判定(小时), 超过该时间视为断签
  reset-hours: 48
  # 签到是否给公会资金
  guild-money: 0.0

# ---------------- 活跃度 ----------------
active:
  # 玩家在线每分钟为公会增加的活跃
  per-minute-online: 1
  # 每个自然月 1 日 0 点重置月度活跃
  monthly-reset: true

# ---------------- 排行榜 ----------------
top:
  # 排行榜显示数量
  size: 10

# ---------------- 匹配公会战 ----------------
# 场地请使用 /zg setLocation mate <场地名> <1|2|3> 在场内设置
#   1 = 红队出生点 (必填)
#   2 = 蓝队出生点 (必填)
#   3 = 观看点     (可选, 被淘汰的玩家会复活在这里观战)
guild-war:
  enabled: true
  # 每个公会每日可发起的匹配次数, 0 = 不限制
  daily-limit: 3
  # 每场每方最多参战人数
  max-players-per-side: 10
  # 准备阶段时长(秒), 期间不可互相攻击, 可自由退出
  prepare-seconds: 30
  # 单场战斗时长(秒), 0 = 直到一方全灭
  battle-seconds: 600
  # 参战期间死亡是否保留物品与经验
  keep-inventory: true
  # 准备与战斗期间禁止丢弃物品
  block-drop: true
  # 准备与战斗期间禁止飞行
  disable-fly: true
  # 战斗期间禁用的指令(管理员豁免), 例如防止用 /spawn 逃跑
  blocked-commands:
    - '/spawn'
    - '/home'
    - '/tpa'
    - '/tpaccept'
    - '/warp'
  # 奖励: 个人贡献给每个参战成员, 公会活跃与资金给公会, commands 以控制台身份执行
  # commands 支持 {player} 与 {guild} 占位符
  rewards:
    # 胜利方
    win:
      contribution: 500.0
      guild-active: 100
      guild-funds: 5000.0
      commands: []
    # 失败方
    lose:
      contribution: 150.0
      guild-active: 30
      guild-funds: 1000.0
      commands: []
    # 平局
    draw:
      contribution: 250.0
      guild-active: 50
      guild-funds: 2000.0
      commands: []
    # 每次击杀的额外个人贡献
    per-kill:
      contribution: 20.0
      guild-active: 0
      guild-funds: 0.0
      commands: []

# ---------------- 自动备份 ----------------
backup:
  enabled: true
  # 备份间隔(小时)
  interval-hours: 24
  # 保留份数
  keep: 7

# ---------------- 其他 ----------------
settings:
  # 调试模式, 输出更多日志
  debug: false
  # 是否启用 PlaceholderAPI 变量
  placeholderapi: true
  # 玩家加入服务器时提示所在公会
  join-reminder: true
  # 无公会玩家加入时的提示
  join-reminder-no-guild: true
