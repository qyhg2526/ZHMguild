# ============================================================
#  ZHMguild GUI 配置文件
#  说明:
#    material   : Bukkit 材质名, 例如 DIAMOND / PLAYER_HEAD
#    name/lore  : MiniMessage 格式, 支持 {xxx} 占位符
#    slot       : 物品所在格子 (从 0 开始)
#  修改后使用 /zg reload 生效, 可用 /zg debug 自检
#  注意: config-version 请勿手动修改, 菜单布局变更时插件会自动备份并重新生成本文件
# ============================================================

config-version: 2

# ---------------- 通用按钮 ----------------
common:
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  back:
    slot: 49
    material: ARROW
    name: '<yellow>返回</yellow>'
    lore:
      - '<gray>返回上一级菜单</gray>'
  close:
    slot: 53
    material: BARRIER
    name: '<red>关闭</red>'
    lore:
      - '<gray>关闭当前界面</gray>'
  previous:
    slot: 45
    material: SPECTRAL_ARROW
    name: '<yellow>上一页</yellow>'
    lore:
      - '<gray>当前第 <white>{page}</white> / <white>{pages}</white> 页</gray>'
  next:
    slot: 53
    material: SPECTRAL_ARROW
    name: '<yellow>下一页</yellow>'
    lore:
      - '<gray>当前第 <white>{page}</white> / <white>{pages}</white> 页</gray>'

# ---------------- 未加入公会 ----------------
no-guild:
  title: '<dark_gray>公会</dark_gray> <gray>»</gray> <yellow>未加入公会</yellow>'
  size: 27
  items:
    create:
      slot: 11
      material: EMERALD_BLOCK
      name: '<green>创建公会</green>'
      lore:
        - '<gray>花费 <yellow>{create_money}</yellow> 金币创建属于你的公会</gray>'
        - '<gray>当前余额: <yellow>{balance}</yellow></gray>'
        - ''
        - '<yellow>» 点击创建</yellow>'
    list:
      slot: 13
      material: BOOK
      name: '<aqua>公会列表</aqua>'
      lore:
        - '<gray>查看服务器中的所有公会</gray>'
        - '<gray>当前共有 <yellow>{total}</yellow> 个公会</gray>'
        - ''
        - '<yellow>» 点击查看</yellow>'
    top:
      slot: 15
      material: GOLDEN_HELMET
      name: '<gold>公会排行</gold>'
      lore:
        - '<gray>查看最强大的公会</gray>'
        - ''
        - '<yellow>» 点击查看</yellow>'

# ---------------- 我的公会 ----------------
main:
  title: '<dark_gray>我的公会</dark_gray> <gray>»</gray> <yellow>{guild}</yellow>'
  size: 54
  items:
    info:
      slot: 4
      material: NETHER_STAR
      name: '<gradient:#00d2ff:#3a7bd5><bold>{guild}</bold></gradient>'
      lore:
        - '<gray>会长: <yellow>{leader}</yellow></gray>'
        - '<gray>等级: <yellow>{level}</yellow></gray>'
        - '<gray>成员: <yellow>{members}</yellow><dark_gray>/</dark_gray><yellow>{max_members}</yellow></gray>'
        - '<gray>在线人口: <yellow>{online}</yellow> 人</gray>'
        - '<gray>活跃: <yellow>{active}</yellow> <dark_gray>|</dark_gray> <gray>月度活跃: <yellow>{month_active}</yellow></gray>'
        - '<gray>资金: <yellow>{funds}</yellow></gray>'
        - '<gray>创建于: <yellow>{create_time}</yellow></gray>'
        - ''
        - '<gray>公告: <white>{notice}</white></gray>'
    members:
      slot: 19
      material: PLAYER_HEAD
      name: '<aqua>成员列表</aqua>'
      lore:
        - '<gray>查看公会中的 <yellow>{members}</yellow> 名成员</gray>'
        - ''
        - '<yellow>» 点击查看</yellow>'
    applications:
      slot: 20
      material: PAPER
      name: '<green>入会申请</green>'
      lore:
        - '<gray>待处理申请: <yellow>{applications}</yellow></gray>'
        - ''
        - '<yellow>» 点击查看</yellow>'
    upgrade:
      slot: 21
      material: EXPERIENCE_BOTTLE
      name: '<light_purple>升级公会</light_purple>'
      lore:
        - '<gray>当前等级: <yellow>{level}</yellow></gray>'
        - '<gray>升级需要资金: <yellow>{up_money}</yellow></gray>'
        - '<gray>升级需要活跃: <yellow>{up_active}</yellow></gray>'
        - ''
        - '<yellow>» 点击升级</yellow>'
    home:
      slot: 22
      material: RED_BED
      name: '<gold>公会主城</gold>'
      lore:
        - '<gray>位置: <yellow>{home}</yellow></gray>'
        - ''
        - '<yellow>» 左键传送</yellow>'
        - '<yellow>» 潜行左键设置主城</yellow>'
    signin:
      slot: 23
      material: CLOCK
      name: '<yellow>每日签到</yellow>'
      lore:
        - '<gray>连续签到: <yellow>{streak}</yellow> 天</gray>'
        - '<gray>今日奖励: <yellow>{reward_money}</yellow> 金币 + <yellow>{reward_contribution}</yellow> 贡献</gray>'
        - ''
        - '<yellow>» 点击签到</yellow>'
    contribute:
      slot: 24
      material: GOLD_INGOT
      name: '<gold>贡献公会</gold>'
      lore:
        - '<gray>把你的金币贡献给公会</gray>'
        - '<gray>你的贡献值: <yellow>{contribution}</yellow></gray>'
        - ''
        - '<yellow>» 左键贡献 {contribute_1} 金币</yellow>'
        - '<yellow>» 右键贡献 {contribute_2} 金币</yellow>'
    list:
      slot: 25
      material: BOOK
      name: '<aqua>公会列表</aqua>'
      lore:
        - '<gray>查看服务器中的所有公会</gray>'
        - ''
        - '<yellow>» 点击查看</yellow>'
    settings:
      slot: 30
      material: COMPARATOR
      name: '<yellow>公会设置</yellow>'
      lore:
        - '<gray>修改公告 / 名称 / 图标 / PVP</gray>'
        - ''
        - '<yellow>» 点击进入</yellow>'
    war:
      slot: 31
      material: DIAMOND_SWORD
      name: '<red>匹配公会战</red>'
      lore:
        - '<gray>当前状态: {war_status}</gray>'
        - '<gray>可参战人口: <yellow>{war_online}</yellow> 人</gray>'
        - '<gray>战绩: {war_record}</gray>'
        - '<gray>今日剩余次数: {war_daily_left}</gray>'
        - ''
        - '<yellow>» 点击进入公会战</yellow>'
    top:
      slot: 32
      material: GOLDEN_HELMET
      name: '<gold>公会排行</gold>'
      lore:
        - '<gray>查看服务器最强公会</gray>'
        - ''
        - '<yellow>» 点击查看</yellow>'
    leave:
      slot: 40
      material: IRON_DOOR
      name: '<red>退出公会</red>'
      lore:
        - '<gray>离开当前公会</gray>'
        - ''
        - '<yellow>» 点击退出</yellow>'

# ---------------- 匹配公会战 ----------------
# 布局: 第 4 格状态总览 | 9-17 我方阵容 | 19-25 信息按钮 | 27-35 敌方阵容 | 38/40/42 操作按钮
guild-war:
  title: '<dark_gray>匹配公会战</dark_gray> <gray>»</gray> <yellow>{guild}</yellow>'
  size: 54
  items:
    status:
      slot: 4
      material: DIAMOND_SWORD
      name: '<red><bold>匹配公会战</bold></red>'
      lore:
        - '<gray>当前状态: {war_status}</gray>'
        - '<gray>匹配队列: <yellow>{queue_size}</yellow> 个公会</gray>'
        - '<gray>今日剩余次数: {daily_left} <dark_gray>({daily_used}/{daily_limit})</dark_gray></gray>'
        - '<gray>准备 <yellow>{prepare_seconds}</yellow> 秒 <dark_gray>|</dark_gray> 战斗 <yellow>{battle_seconds}</yellow> 秒</gray>'
    arena:
      slot: 19
      material: GRASS_BLOCK
      name: '<green>公会战场地</green>'
      lore:
        - '<gray>可用场地: <yellow>{available_arenas}</yellow><dark_gray>/</dark_gray><yellow>{total_arenas}</yellow></gray>'
        - '<gray>当前: {arenas}</gray>'
        - ''
        - '<yellow>» 点击查看全部场地</yellow>'
    rewards:
      slot: 21
      material: GOLD_INGOT
      name: '<gold>奖励预览</gold>'
      lore:
        - '<gray>胜利: <yellow>{win_contribution}</yellow> 贡献 / <yellow>{win_funds}</yellow> 资金</gray>'
        - '<gray>失败: <yellow>{lose_contribution}</yellow> 贡献</gray>'
        - '<gray>每击杀: <yellow>{kill_contribution}</yellow> 贡献</gray>'
        - ''
        - '<yellow>» 点击查看完整奖励</yellow>'
    record:
      slot: 23
      material: WRITABLE_BOOK
      name: '<aqua>公会战绩</aqua>'
      lore:
        - '<green>胜: <yellow>{wins}</yellow></green>'
        - '<red>负: <yellow>{loses}</yellow></red>'
        - '<gray>平: <yellow>{draws}</yellow></gray>'
    population:
      slot: 25
      material: PLAYER_HEAD
      name: '<yellow>参战人口</yellow>'
      lore:
        - '<gray>在线成员: <yellow>{online_members}</yellow></gray>'
        - '<gray>参战人数: <yellow>{participants}</yellow> 人 (每方最多 <yellow>{max_per_side}</yellow>)</gray>'
        - '<gray>存活人数: <yellow>{alive}</yellow></gray>'
    match:
      slot: 38
      material: LIME_CONCRETE
      name: '<green>开始匹配</green>'
      lore:
        - '<gray>加入匹配队列, 满 2 个公会后自动开战</gray>'
        - '<gray>当前在线可参战: <yellow>{online_members}</yellow> 人</gray>'
        - ''
        - '<yellow>» 点击开始匹配</yellow>'
    cancel:
      slot: 40
      material: RED_CONCRETE
      name: '<red>取消匹配</red>'
      lore:
        - '<gray>把公会移出匹配队列</gray>'
        - ''
        - '<yellow>» 点击取消匹配</yellow>'
    leave:
      slot: 42
      material: IRON_DOOR
      name: '<yellow>离开战斗</yellow>'
      lore:
        - '<gray>准备阶段可无损失退出</gray>'
        - '<gray>战斗阶段退出视为被淘汰</gray>'
        - ''
        - '<yellow>» 点击离开</yellow>'
  # 阵容中的空位填充物(模板, 无固定槽位)
  empty-item:
    material: GRAY_STAINED_GLASS_PANE
    name: '<dark_gray>空位</dark_gray>'
  # 我方 / 红队成员头像
  ally-item:
    material: PLAYER_HEAD
    name: '<white>{player}</white> {alive}'
    lore:
      - '<gray>职位: {role}</gray>'
      - '<gray>击杀: <yellow>{kills}</yellow></gray>'
  # 敌方 / 蓝队成员头像
  enemy-item:
    material: PLAYER_HEAD
    name: '<white>{player}</white> {alive}'
    lore:
      - '<gray>击杀: <yellow>{kills}</yellow></gray>'
  # 未参战时显示的可参战成员
  member-item:
    material: PLAYER_HEAD
    name: '<white>{player}</white> <green>可参战</green>'
    lore:
      - '<gray>职位: {role}</gray>'
      - '<gray>贡献: <yellow>{contribution}</yellow></gray>'

# ---------------- 公会战场地列表 ----------------
war-arena:
  title: '<dark_gray>公会战场地</dark_gray>'
  size: 54
  arena-item:
