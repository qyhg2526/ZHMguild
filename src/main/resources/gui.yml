        - '<gray>公会活跃: <yellow>{guild_active}</yellow></gray>'
        - '<gray>公会资金: <yellow>{guild_funds}</yellow></gray>'
        - '<gray>额外指令: <yellow>{commands}</yellow></gray>'
    lose:
      slot: 12
      material: BREAD
      name: '<yellow>失败奖励</yellow>'
      lore:
        - '<gray>个人贡献: <yellow>{contribution}</yellow></gray>'
        - '<gray>公会活跃: <yellow>{guild_active}</yellow></gray>'
        - '<gray>公会资金: <yellow>{guild_funds}</yellow></gray>'
        - '<gray>额外指令: <yellow>{commands}</yellow></gray>'
