  set: '<green>公会主城已设置到当前位置!</green>'
  not-set: '<red>公会还没有设置主城!</red>'
  teleporting: '<yellow>正在传送至公会主城, 请保持不动 <white>{time}</white> 秒...</yellow>'
  teleported: '<green>已传送至公会主城!</green>'
  moved: '<red>传送已取消, 因为你移动了!</red>'
  cooldown: '<red>传送冷却中, 请等待 <yellow>{time}</yellow> 秒!</red>'
  world-invalid: '<red>公会主城所在世界不存在!</red>'
  deleted: '<green>公会主城已删除!</green>'

# ---------------- 签到 ----------------
signin:
  success: '<green>签到成功! 获得 <yellow>{money}</yellow> 金币, <yellow>{contribution}</yellow> 贡献, 公会活跃 +<yellow>{active}</yellow></green>'
  already: '<red>你今天已经签到过了, 明天再来吧!</red>'
  streak: '<gray>你已经连续签到 <yellow>{days}</yellow> 天, 获得 <yellow>{bonus}x</yellow> 奖励加成!</gray>'
  broadcast: '<yellow>{player}</yellow> <gray>完成了今日公会签到, 连续</gray> <yellow>{days}</yellow> <gray>天!</gray>'

# ---------------- 公告 ----------------
notice:
